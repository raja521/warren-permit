<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warren County Permitting – Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7;--panel:#FFFFFF;--ink:#16203D;--muted:#5A6480;--line:#D6DCE8;
  --forest:#1F2D5A;--forest-2:#3C77D1;--lake:#2E6E8E;--lake-soft:#BFD9E6;
  --land:#E9EFE3;--parcel:#F7F9F4;--amber:#B87414;--amber-soft:#FBEBD2;
  --red:#A83232;--red-soft:#F8DEDE;--green:#23794A;--green-soft:#DDF1E4;--blue-soft:#E1ECF3;
  --focus:#3C77D1;--brand:#1F2D5A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1426;--panel:#161D35;--ink:#E6EAF5;--muted:#9AA5C4;--line:#29324F;
  --forest:#8FB4EE;--forest-2:#5E93E0;--lake:#6FB2D2;--lake-soft:#1E3E4E;
  --land:#1A2238;--parcel:#222C47;--amber:#F0B45A;--amber-soft:#3A2C16;
  --red:#F08A8A;--red-soft:#3D1F1F;--green:#7ED3A2;--green-soft:#1C3527;--blue-soft:#1C2E38}}
:root[data-theme="dark"]{
  --bg:#0F1426;--panel:#161D35;--ink:#E6EAF5;--muted:#9AA5C4;--line:#29324F;
  --forest:#8FB4EE;--forest-2:#5E93E0;--lake:#6FB2D2;--lake-soft:#1E3E4E;
  --land:#1A2238;--parcel:#222C47;--amber:#F0B45A;--amber-soft:#3A2C16;
  --red:#F08A8A;--red-soft:#3D1F1F;--green:#7ED3A2;--green-soft:#1C3527;--blue-soft:#1C2E38}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#1F2D5A;color:#fff;border-bottom:3px solid #3C77D1}
:root[data-theme="dark"] header.top,:root:not([data-theme="light"]) header.top{}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;color:#fff}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.8;letter-spacing:0}
nav.views{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px}
nav.views button{background:none;border:0;color:#fff;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
nav.views button[aria-pressed="true"]{background:#3C77D1;color:#fff}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.bar select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
.bar select option{color:#17261D}
.ghost{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px}
.note{font-size:13px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:18px}
.apply{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.review{grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr)}
@media (max-width:900px){.apply,.review{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.15;margin-bottom:4px}
h2{font-size:18px;letter-spacing:-.01em;margin-bottom:10px}
h3{font-size:15px;margin:14px 0 8px}
p.lead{color:var(--muted);max-width:64ch;margin-bottom:14px}
ol.steps{list-style:none;display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
ol.steps li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:20px;background:var(--bg)}
ol.steps li b{width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-size:11px}
ol.steps li.on{color:var(--ink);font-weight:600;background:var(--blue-soft)}
ol.steps li.on b{background:#3C77D1;color:#fff}
ol.steps li.done b{background:var(--green);color:#fff}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select.f,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.type{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.type:hover{border-color:var(--forest-2)}
.type[aria-pressed="true"]{border-color:#3C77D1;box-shadow:inset 0 0 0 2px #3C77D1}
.type span{display:block;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;background:#3C77D1;color:#fff}
.btn:hover{background:#2F63B5}
:root:not([data-theme="light"]) .btn{}
.btn.sec{background:var(--panel);color:var(--forest);border:1px solid var(--forest-2)}
.btn.sec:hover{background:var(--blue-soft)}
.btn.warn{background:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--green-soft);color:var(--green)}.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}.c-info{background:var(--blue-soft);color:var(--lake)}
/* map */
.mapwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--land)}
.mapwrap svg{display:block;width:100%;height:auto}
.parcel{fill:var(--parcel);stroke:#8E9C86;stroke-width:1;cursor:pointer;transition:fill .15s}
.parcel:hover{fill:#FFF6D6}
.parcel.sel{fill:#FFD66E;stroke:#A76D00;stroke-width:3}
.parcel.inapp{stroke:var(--lake);stroke-width:2;stroke-dasharray:4 3}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.layers label{margin:0;font-weight:500;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer}
.layers input{width:auto}
.maphint{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
/* checks */
.checks{list-style:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.checks li{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.checks li:last-child{border-bottom:0}
.checks li .k{font-weight:600}
.checks li.pending{color:var(--muted)}
.checks li.pending .chip{background:var(--line);color:var(--muted)}
@media (max-width:560px){.checks li{grid-template-columns:1fr auto}.checks li .v{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:no-preference){.checks li.reveal{animation:rv .35s ease-out}@keyframes rv{from{background:var(--amber-soft)}to{background:transparent}}}
.fee{display:flex;justify-content:space-between;align-items:center;background:var(--blue-soft);border-radius:10px;padding:12px 14px;margin-top:14px}
.fee b{font-size:20px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td:first-child,.tbl td:nth-child(3){white-space:nowrap}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--bg)}
.tbl tr.row.sel td{background:var(--amber-soft)}
.scroll{overflow-x:auto}
.flow{display:flex;gap:4px;margin:12px 0}
.flow div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.flow div i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:5px}
.flow div.done i{background:var(--green)}.flow div.now{color:var(--ink);font-weight:700}.flow div.now i{background:#3C77D1}
.log{list-style:none;font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px;margin-top:6px}
.log li{margin:5px 0}
.meta{font-size:13.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;color:var(--forest);line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.reports{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:900px){.reports{grid-template-columns:1fr}}
.out{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.out p{font-size:13.5px;color:var(--muted);margin:3px 0 10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* modal */
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,15,.5)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dbody{padding:18px;max-height:70vh;overflow:auto}
.paper{background:#fff;color:#111;border:1px solid #ccc;padding:28px 34px;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.5}
.paper h4{text-align:center;font-size:16px;margin-bottom:2px}
.paper .c{text-align:center;margin-bottom:14px}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.labels div{border:1px dashed #bbb;padding:10px;font-size:12.5px;line-height:1.35;min-height:70px;background:#fff;color:#111}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{max-width:1280px;margin:0 auto;padding:6px 20px 30px;font-size:12.5px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.settings{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.settings{grid-template-columns:1fr}}
.mini{width:auto;padding:6px 8px;font-size:14px}
.money{display:inline-flex;align-items:center;gap:4px}.money input{width:84px}
.btn.small{padding:6px 11px;font-size:13px;font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.addrow select,.addrow input{flex:1;min-width:200px}
.bul{padding-left:18px;font-size:14px}.bul li{margin:6px 0}
.qlist{list-style:none;margin-bottom:12px}.qlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.townfields{margin-top:14px;border:1px solid var(--forest-2);border-radius:10px;padding:4px 14px 14px;background:var(--blue-soft)}
.townfields input{background:var(--panel)}
.tf-head{font-size:13px;font-weight:700;color:var(--forest);margin-top:10px}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media (max-width:560px){.tf-grid{grid-template-columns:1fr}}
.tour{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;width:min(380px,calc(100% - 40px));background:var(--panel);border:1px solid var(--line);border-top:4px solid #3C77D1;border-radius:14px;padding:16px 18px;box-shadow:0 12px 32px rgba(15,25,60,.25)}
.tour h2{margin:4px 0 6px}.tour p{font-size:14px;color:var(--muted)}
.tour-step{font-size:12px;color:#3C77D1;font-weight:700}
.tour-nav{display:flex;gap:8px;margin-top:14px;align-items:center}.tour-nav span{flex:1}
.tour-hl{outline:3px solid #3C77D1;outline-offset:4px;border-radius:12px;position:relative}
@media (prefers-reduced-motion:no-preference){.tour-hl{animation:pulse 1.6s ease-out 2}@keyframes pulse{0%{outline-color:#3C77D1}50%{outline-color:rgba(60,119,209,.2)}100%{outline-color:#3C77D1}}}
@media (max-width:760px){nav.views button{padding:6px 9px;font-size:13px}}
</style>
</head>

    <div class="brand">

    <table class="tbl"><thead><tr><th>Town</th><th>Applications</th><th>Issued</th><th>Housing-related</th></tr></thead><tbody>${T.map(t=>{const x=S.apps.filter(a=>a.town===t);return `<tr><td>${esc(t)}</td><td>${x.length}</td><td>${x.filter(a=>a.status==="Issued").length}</td><td>${x.filter(a=>housing.test(a.type)).length}</td></tr>`}).join("")}</tbody></table></div>`);
  $("#rag").onclick=()=>openDlg("Board meeting agenda",`<div class="paper"><h4>${T.length>1?"Planning and Zoning Boards":"Town of "+esc(T[0])}</h4><div class="c">Regular meeting · November 16, 2027 · 7:00 PM</div>
    ${sched.length?`<ol style="padding-left:20px">${sched.map(a=>`<li style="margin:8px 0"><b>${a.id}</b> – ${esc(a.type)} (${boardOf(a.town,a.type)||"Staff"})<br>Applicant: ${esc(a.applicant)} · Parcel ${pid(a.town,a.n)}, ${addr(a.n)}, ${esc(a.town)}${a.referred?"<br><i>County §239 referral on file</i>":""}</li>`).join("")}</ol>`:"<p>No applications scheduled. Schedule one from the Review view.</p>"}</div>`);
}
// ---------- Dialog ----------
function openDlg(t,h){$("#dtitle").textContent=t;$("#dbody").innerHTML=h;const d=$("#dlg");if(!d.open){d.showModal?d.showModal():d.setAttribute("open","");}}
function closeDlg(){const d=$("#dlg");d.close?d.close():d.removeAttribute("open");}
$("#dclose").onclick=closeDlg;
// ---------- Guided tour ----------
const TOUR=[
 {t:"Welcome",b:"This 2-minute tour shows how residents apply, how town staff review, and how the County configures and reports. Everything here is clickable, so feel free to explore after.",go:()=>{form=blankForm();town="Bolton";setView("apply");},hl:null},
 {t:"Each town has its own permits",b:"Bolton offers 15 permit types with its own flat fees. Switch towns in the header to see Chester, Hague, or Horicon's list.",go:()=>{setView("apply");},hl:"#types"},
 {t:"Automatic map checks",b:"When a resident picks a parcel, the system checks zoning, Adirondack Park Agency class, wetlands, flood zone, shoreline distance, slopes, and flags §239 County referrals.",go:()=>{form=blankForm();form.type="Site Plan Review";form.step=2;setView("apply");setTimeout(()=>pickParcel(15),250);},hl:"#checks"},
 {t:"Town-specific questions",b:"The same permit asks different questions in each town. Bolton's Site Plan asks for shoreline setback; Chester's asks for base flood elevation.",go:()=>{form.step=3;if(form.n==null)form.n=15;setView("apply");},hl:"#townfields"},
 {t:"Staff review and workflow",b:"Town staff see their queue, the saved map checks, and one-click next steps: mark complete, refer to the County, schedule the board, approve, and issue.",go:()=>{staffTown="Bolton";selApp="BO-2027-030";setView("review");},hl:"#detail"},
 {t:"Settings, not code",b:"County administrators change fees, review steps, and form questions, add permit types, or add a whole new town. Try it: add a town and it appears in every view.",go:()=>{setTown="Chester";setView("settings");},hl:"#permitcfg"},
 {t:"Reports for Pro-Housing",b:"County Planning sees live counts across all towns and produces the Pro-Housing summary and board agendas in Word.",go:()=>{town="All";setView("reports");},hl:"#outputs"}
];
let ti=-1;
function tourShow(i){ti=i;const s=TOUR[i];document.querySelectorAll(".tour-hl").forEach(e=>e.classList.remove("tour-hl"));s.go();
  const card=$("#tour");card.hidden=false;
  card.innerHTML=`<div class="tour-step">Step ${i+1} of ${TOUR.length}</div><h2>${s.t}</h2><p>${s.b}</p>
   <div class="tour-nav"><button class="btn sec small" id="tskip">${i===TOUR.length-1?"Close":"Skip tour"}</button><span></span>
   ${i>0?'<button class="btn sec small" id="tprev">Back</button>':""}${i<TOUR.length-1?'<button class="btn small" id="tnext">Next</button>':'<button class="btn small" id="tdone">Start exploring</button>'}</div>`;
  const end=()=>{card.hidden=true;document.querySelectorAll(".tour-hl").forEach(e=>e.classList.remove("tour-hl"));try{localStorage.setItem(TOURKEY,"1");}catch(e){}};
  $("#tskip").onclick=end;if($("#tdone"))$("#tdone").onclick=end;
  if($("#tnext"))$("#tnext").onclick=()=>tourShow(i+1);if($("#tprev"))$("#tprev").onclick=()=>tourShow(i-1);
  if(s.hl)setTimeout(()=>{const e=$(s.hl);if(e){e.classList.add("tour-hl");e.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});}},450);
  $("#tnext")?$("#tnext").focus():$("#tdone").focus();
}
// ---------- Shell ----------
function fillTownSelect(){
  if(town!=="All"&&!C().towns[town])town=townList()[0];
  const s=$("#town");s.innerHTML=townList().map(t=>`<option ${t===town?"selected":""}>${esc(t)}</option>`).join("")+(view==="reports"?`<option value="All" ${town==="All"?"selected":""}>All towns</option>`:"");
  s.style.visibility=(view==="apply"||view==="reports")?"visible":"hidden";}
function setView(v){view=v;if(v!=="reports"&&town==="All")town=townList()[0];
  document.querySelectorAll("nav.views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));
  fillTownSelect();({apply:renderApply,review:renderReview,reports:renderReports,settings:renderSettings})[v]();window.scrollTo(0,0);}
document.querySelectorAll("nav.views button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("#town").onchange=e=>{town=e.target.value;form=blankForm();setView(view);};
$("#reset").onclick=()=>{S=seed();save();form=blankForm();selApp=null;town="Bolton";setTown="Bolton";staffTown="Bolton";setView("apply");toast("Demo data reset");};
$("#tourbtn").onclick=()=>tourShow(0);
setView("apply");
let toured=false;try{toured=localStorage.getItem(TOURKEY)==="1";}catch(e){}
if(!toured)setTimeout(()=>tourShow(0),400);
})();

</script>
</body>
</html>
